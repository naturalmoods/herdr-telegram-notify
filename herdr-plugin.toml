id = "naturalmoods.herdr-telegram-notify"
name = "Herdr Telegram Notify"
version = "0.12.0"
min_herdr_version = "0.8.0"
description = "Messages you on Telegram when an agent finishes or needs input, with its last message, changes, duration and cost. Answer from the chat with text, menu buttons, files, photos or voice; stop an agent, read its screen or diff, or start a new one. Notifications mark themselves answered, and a pinned board shows the whole herd."
platforms = ["linux", "macos"]

# Replies and queued messages should not wait for an agent to change status
# after Herdr starts, so start the configured background processes right away.
[[startup]]
command = ["/bin/sh", "run.sh", "notify.mjs", "--startup"]

[[events]]
on = "pane.agent_status_changed"
# Herdr's server may not have the interactive shell's PATH (an nvm-installed node
# is invisible to it), so the launcher finds a node itself. See run.sh.
command = ["/bin/sh", "run.sh", "notify.mjs"]

# A closed pane cannot raise another status change, so close its notifications
# and refresh the board without waiting for another agent to finish.
[[events]]
on = "pane.closed"
command = ["/bin/sh", "run.sh", "notify.mjs"]

# Silence the notifier without editing the config: one action that mutes, and
# lifts the mute when it is already on. Bind it to a key in herdr's config.toml.
[[actions]]
id = "mute"
title = "Mute/unmute Telegram notifications"
description = "Stop sending for MUTE_MINUTES (default an hour), or start again if already muted."
command = ["/bin/sh", "run.sh", "mute.mjs"]

# Layouts are client-local, so run this action where the Herdr window runs.
[[actions]]
id = "sidebar"
title = "Show Telegram state in the Herdr sidebar"
description = "Add a separate $telegram row to the local client config, with a backup and config check."
command = ["/bin/sh", "run.sh", "sidebar.mjs"]

# Check everything the notifier depends on and send one test message. The report
# lands in `herdr plugin log list`; the verdict in a Herdr notification.
[[actions]]
id = "doctor"
title = "Check Telegram notify setup"
description = "Verify node, herdr, git, the config, the state directory and the bot credentials, then send a test message."
command = ["/bin/sh", "run.sh", "doctor.mjs"]
