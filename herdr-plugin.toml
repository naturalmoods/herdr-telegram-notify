id = "naturalmoods.herdr-telegram-notify"
name = "Herdr Telegram Notify"
version = "0.2.1"
min_herdr_version = "0.8.0"
description = "Sends a Telegram message when a Herdr-managed agent finishes or gets blocked, with the session title, project, duration and the agent's last message."
platforms = ["linux", "macos"]

[[events]]
on = "pane.agent_status_changed"
# Herdr's server may not have the interactive shell's PATH (an nvm-installed node
# is invisible to it), so the launcher finds a node itself. See run.sh.
command = ["/bin/sh", "run.sh"]
